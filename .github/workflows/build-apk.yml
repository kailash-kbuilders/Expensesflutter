name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib
            flutter create --platforms=android --project-name expense_tracker --org com.kailash.expensetracker .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib test
            cp -r /tmp/lib lib
          fi
          sed -i 's/android:label="[^"]*"/android:label="Expense Tracker"/' android/app/src/main/AndroidManifest.xml

      - name: Apply launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi* android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable*/ic_launcher* android/app/src/main/res/values/ic_launcher*
          cp -r android_res/* android/app/src/main/res/

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
